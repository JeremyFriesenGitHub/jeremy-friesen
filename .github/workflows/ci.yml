name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nothing in this workflow writes to the repository.
permissions:
  contents: read

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.56 cannot install
    # Chromium's dependencies on (1.64 can). Back to ubuntu-latest once
    # @playwright/test is bumped past that.
    runs-on: ubuntu-24.04
    steps:
      # Pinned to commit SHAs; Dependabot (github-actions ecosystem) keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is never needed after checkout; don't leave it in .git/config
          # for ~440 packages' install scripts to find.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      # Fails outright on a malformed or out-of-sync lockfile, which is the
      # point: a lockfile with merge conflict markers reached main once.
      # Node 22 ships npm 10; regenerate the lockfile with `npx npm@10` locally.
      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

      # The smoke tests (tests/) drive the production build in headless
      # Chromium: pages render, the lamp draws, the grid expands, the résumé
      # prints, case studies carry link previews, and text stays readable.
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke-test the production build
        run: npm run test:smoke

      # Advisory only. A new advisory can land against a production dep at any
      # time, through no fault of the PR in front of it — so this reports
      # without blocking the merge. Dependabot is what actually chases these.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
