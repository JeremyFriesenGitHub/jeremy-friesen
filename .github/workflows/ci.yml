name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Fails outright on a malformed or out-of-sync lockfile, which is the
      # point: a lockfile with merge conflict markers reached main once.
      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

      # Advisory only. A new advisory can land against a production dep at any
      # time, through no fault of the PR in front of it — so this reports
      # without blocking the merge. Dependabot is what actually chases these.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
