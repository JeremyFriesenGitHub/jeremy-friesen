version: 2
updates:
  # Security updates are enabled separately in the repository settings and land
  # as soon as an advisory is published. These are the routine version bumps,
  # grouped so they arrive as at most two PRs a month.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
    open-pull-requests-limit: 4
    ignore:
      # typescript-eslint 8 declares a peer range of typescript <6.1, so npm ci
      # refuses the TypeScript 7 bump (#41). Drop this once typescript-eslint
      # (pulled in by eslint-config-next) supports TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
